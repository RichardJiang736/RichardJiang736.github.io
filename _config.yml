# Jekyll configuration for the site.
#
# GitHub Pages builds this with its legacy Jekyll build. Only built-in
# features are used: collections, layouts, kramdown, and static redirect pages.

title: Richard Jiang
description: What I think. Writing, projects, and art.
url: "https://richardjiang736.github.io"
baseurl: ""

permalink: /writing/:title/
markdown: kramdown
highlighter: rouge

collections:
  poetry:
    output: true
    permalink: /poetry/:path/
  diary:
    output: true
    permalink: /diary/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: poetry
    values:
      layout: entry
  - scope:
      path: ""
      type: diary
    values:
      layout: entry
      # The diary is private; only the `--unpublished` archive build renders it.
      published: false

exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - scripts/
  - .archive-src/
  - .archive-site/
  - resources/diary/
  - server.js
