---
layout: default
---
<article class="entry entry--post">
  <header class="entry-head">
    <p class="entry-meta">
      {{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}
    </p>
    <h1 class="entry-title">{{ page.title }}</h1>
    {% if page.description %}<p class="entry-dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
